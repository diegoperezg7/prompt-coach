name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Versión fijada: la API de mods evoluciona; se sube a mano tras comprobar que los tests siguen en verde.
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: claude plugin validate .
      - run: claude plugin test .
