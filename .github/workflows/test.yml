name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Versión fijada: la API de mods evoluciona; se sube a mano tras comprobar que los tests siguen en verde.
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: claude plugin validate .
      - run: claude plugin test .
      # La CLI que usa el adaptador de Codex: un prompt flojo se retiene, uno con raw: pasa.
      - run: echo '{"prompt":"fix the login"}' | node --experimental-strip-types --no-warnings cli/prompt-coach.mts hook codex | grep -q '"decision":"block"'
      - run: test -z "$(echo '{"prompt":"raw: fix the login"}' | node --experimental-strip-types --no-warnings cli/prompt-coach.mts hook codex)"
