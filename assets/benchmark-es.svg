<text x="819" y="175" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12.5">7,5 s</text>
  <path d="M32 300.5 H848" stroke="var(--line)"/>
  <text x="32" y="328" font-size="11.5" fill="var(--muted)">El eje de la nota media empieza en 80.</text>
