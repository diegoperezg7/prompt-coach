<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="t d">
  <title id="t">Haiku, Sonnet u Opus · 16 borradores reales en 6 idiomas</title>
  <desc id="d">Coste por mejora: Haiku 0,00055 $, Sonnet 0,0111 $, Opus 0,0239 $. Nota media 93,4, 93,5 y 94,8. Utilidad según el juez 7,5, 7,9 y 8,0. Latencia 3,8, 5,4 y 7,5 segundos.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#0b0b0f; --muted:#5b5b6b; --line:#e4e2ee; --accent:#7c3aed; --other:#9a98a8; --third:#c9c7d3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --fg:#f4f3f8; --muted:#a3a1b3; --line:#2a2833; --accent:#a78bfa; --other:#6d6b7b; --third:#3f3d4a; } }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="349" rx="16" fill="var(--bg)" stroke="var(--line)"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="var(--fg)">Haiku, Sonnet u Opus · 16 borradores reales en 6 idiomas</text>
  <g font-size="13" fill="var(--muted)">
    <rect x="32" y="60" width="12" height="12" rx="3" fill="var(--accent)"/><text x="50" y="71">Haiku (por defecto)</text>
    <rect x="236" y="60" width="12" height="12" rx="3" fill="var(--other)"/><text x="254" y="71">Sonnet</text>
    <rect x="326" y="60" width="12" height="12" rx="3" fill="var(--third)"/><text x="344" y="71">Opus</text>
    <text x="410" y="71">Juez ciego: Opus. Mismo flujo que el mod.</text>
  </g>
  <text x="32" y="104" font-weight="700" fill="var(--fg)" font-size="14">Coste por mejora</text>
<text x="32" y="122" fill="var(--muted)" font-size="12">Opus 43 veces Haiku</text>
