<text x="337" y="207" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12.5">93,5</text>
<rect x="372" y="208" width="46" height="92" rx="4" fill="var(--third)"/>
<text x="395" y="200" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12.5">94,8</text>
