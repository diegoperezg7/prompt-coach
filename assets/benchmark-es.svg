<text x="67" y="286" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12.5">0,00055 $</text>
<rect x="102" y="245" width="46" height="55" rx="4" fill="var(--other)"/>
<text x="125" y="237" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="12.5">0,0111 $</text>
