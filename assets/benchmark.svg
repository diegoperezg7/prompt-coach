<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="t d">
  <title id="t">Haiku, Sonnet or Opus · 16 real drafts in 6 languages</title>
  <desc id="d">Cost per rewrite: Haiku $0.00055, Sonnet $0.0111, Opus $0.0239. Average score 93.4, 93.5 and 93.8. Usefulness per the judge 7.5, 7.9 and 8.0. Latency 3.8, 5.4 and 7.5 seconds.</desc>
